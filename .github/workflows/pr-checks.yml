name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m venv .venv-ci
      - run: echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Check Python and shell syntax (no AWS or Salesforce access)
        run: |
          python -m compileall -q src
          for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: node --test .github/tests/codex-review-gate.node.mjs
